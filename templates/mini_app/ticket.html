{% extends "layout.html" %} {% block content %}
<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <h1 class="h3 mb-4">Novo chamado</h1>

      <form id="ticket-form">
        <div class="mb-3">
          <label for="service-date" class="form-label">
            Data do atendimento
          </label>

          <input
            type="date"
            class="form-control"
            id="service-date"
            name="service_date"
            required
          />
        </div>

        <div class="mb-3">
          <label for="service-time" class="form-label">
            Horário do atendimento
          </label>

          <input
            type="time"
            class="form-control"
            id="service-time"
            name="service_time"
            required
          />
        </div>

        <div class="mb-3">
          <label for="contractor" class="form-label"> Contratante </label>

          <input
            type="text"
            class="form-control"
            id="contractor"
            name="contractor"
            autocomplete="organization"
            required
          />
        </div>

        <div class="mb-3">
          <label for="client" class="form-label"> Cliente </label>

          <input
            type="text"
            class="form-control"
            id="client"
            name="client"
            autocomplete="name"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary w-100">
          Criar chamado
        </button>
      </form>
    </div>
  </div>
</main>

{% endblock %}
