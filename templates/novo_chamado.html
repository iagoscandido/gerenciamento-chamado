{% extends "layout.html" %} {% block title %} Novo chamado {% endblock %} {%
block content %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <h1 class="h2 mb-4">Registrar chamado</h1>

      <form
        method="post"
        action="/chamados"
        hx-post="/chamados"
        hx-target="#resultado"
        hx-swap="innerHTML"
      >
        <fieldset class="mb-4">
          <legend class="h5">Atendimento</legend>

          <div class="row g-3">
            <div class="col-md-4">
              <label for="data_atendimento" class="form-label"> Data </label>

              <input
                type="date"
                class="form-control"
                id="data_atendimento"
                name="data_atendimento"
                value="{{ chamado.data_atendimento or '' }}"
                required
              />
            </div>

            <div class="col-md-4">
              <label for="hora_inicio" class="form-label">
                Hora de início
              </label>

              <input
                type="time"
                class="form-control"
                id="hora_inicio"
                name="hora_inicio"
                value="{{ chamado.hora_inicio or '' }}"
                required
              />
            </div>

            <div class="col-md-4">
              <label for="hora_fim" class="form-label"> Hora de término </label>

              <input
                type="time"
                class="form-control"
                id="hora_fim"
                name="hora_fim"
                value="{{ chamado.hora_termino or '' }}"
                required
              />
            </div>
          </div>
        </fieldset>

        <fieldset class="mb-4">
          <legend class="h5">Valores</legend>

          <div class="row g-3">
            <div class="col-md-6">
              <label for="valor" class="form-label"> Valor </label>

              <input
                type="number"
                class="form-control"
                id="valor"
                name="valor"
                min="0"
                step="0.01"
                value="{{ chamado.valor or 0.0 }}"
              />
            </div>

            <div class="col-md-6">
              <label for="despesas" class="form-label"> Despesas </label>

              <input
                type="number"
                class="form-control"
                id="despesas"
                name="despesas"
                min="0"
                step="0.01"
                value="{{ chamado.despesas or 0.0 }}"
              />
            </div>
          </div>
        </fieldset>

        <fieldset class="mb-4">
          <legend class="h5">Cliente</legend>

          <div class="row g-3">
            <div class="col-md-6">
              <label for="cliente" class="form-label"> Cliente </label>

              <input
                type="text"
                class="form-control"
                id="cliente"
                name="cliente"
                value="{{ chamado.cliente or '' }}"
                required
              />
            </div>

            <div class="col-md-6">
              <label for="cliente_final" class="form-label">
                Cliente final
              </label>

              <input
                type="text"
                class="form-control"
                id="cliente_final"
                name="cliente_final"
                value="{{ chamado.cliente_final or '' }}"
                required
              />
            </div>

            <div class="col-md-6">
              <label for="contato" class="form-label"> Contato </label>

              <input
                type="text"
                class="form-control"
                id="contato"
                name="contato"
                value="{{ chamado.contato or '' }}"
                required
              />
            </div>

            <div class="col-md-6">
              <label for="localidade" class="form-label"> Localidade </label>

              <input
                type="text"
                class="form-control"
                id="localidade"
                name="localidade"
                value="{{ chamado.localidade or '' }}"
                required
              />
            </div>
          </div>
        </fieldset>

        <fieldset class="mb-4">
          <legend class="h5">Atendimento técnico</legend>

          <div class="mb-3">
            <label for="escopo" class="form-label"> Escopo </label>

            <textarea
              class="form-control"
              id="escopo"
              name="escopo"
              rows="4"
              value="{{ chamado.escopo or '' }}"
              required
            ></textarea>
          </div>

          <div class="mb-3">
            <label for="resumo_tecnico" class="form-label">
              Resumo técnico
            </label>

            <textarea
              class="form-control"
              id="resumo_tecnico"
              name="resumo_tecnico"
              rows="6"
              value="{{ chamado.resumo_tecnico or '' }}"
              required
            ></textarea>
          </div>
        </fieldset>

        <div class="d-flex justify-content-end gap-2">
          <a href="/chamados" class="btn btn-outline-secondary"> Cancelar </a>

          <button type="submit" class="btn btn-primary">
            Registrar chamado
          </button>
        </div>

        <div id="resultado" class="mt-3"></div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
