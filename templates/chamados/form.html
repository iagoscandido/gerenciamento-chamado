{% extends "layout.html" %}{% block content %}
<form
  id="chamado-form"
  hx-action="/chamados"
  hx-method="/chamados"
  hx-target="#form-result"
  hx-swap="innerHTML"
  class="needs-validation"
>
  <fieldset class="mb-4">
    <legend class="h5 border-bottom pb-2 mb-3">Atendimento</legend>

    <div class="row g-3">
      <div class="col-md-4">
        <label for="data_atendimento" class="form-label">
          Data do atendimento
        </label>

        <input
          type="date"
          class="form-control"
          id="data_atendimento"
          name="data_atendimento"
          required
        />
      </div>

      <div class="col-md-4">
        <label for="hora_inicio" class="form-label"> Hora de início </label>

        <input
          type="time"
          class="form-control"
          id="hora_inicio"
          name="hora_inicio"
          required
        />
      </div>

      <div class="col-md-4">
        <label for="hora_fim" class="form-label"> Hora de término </label>

        <input
          type="time"
          class="form-control"
          id="hora_fim"
          name="hora_fim"
          required
        />
      </div>
    </div>
  </fieldset>

  <fieldset class="mb-4">
    <legend class="h5 border-bottom pb-2 mb-3">Valores</legend>

    <div class="row g-3">
      <div class="col-md-6">
        <label for="valor" class="form-label"> Valor do atendimento </label>

        <div class="input-group">
          <span class="input-group-text">R$</span>

          <input
            type="number"
            class="form-control"
            id="valor"
            name="valor"
            min="0"
            step="0.01"
            value="0.00"
            inputmode="decimal"
          />
        </div>
      </div>

      <div class="col-md-6">
        <label for="despesas" class="form-label"> Despesas </label>

        <div class="input-group">
          <span class="input-group-text">R$</span>

          <input
            type="number"
            class="form-control"
            id="despesas"
            name="despesas"
            min="0"
            step="0.01"
            value="0.00"
            inputmode="decimal"
          />
        </div>
      </div>
    </div>
  </fieldset>

  <fieldset class="mb-4">
    <legend class="h5 border-bottom pb-2 mb-3">Cliente e localização</legend>

    <div class="row g-3">
      <div class="col-md-6">
        <label for="cliente" class="form-label"> Cliente </label>

        <input
          type="text"
          class="form-control"
          id="cliente"
          name="cliente"
          autocomplete="organization"
          required
        />
      </div>

      <div class="col-md-6">
        <label for="cliente_final" class="form-label"> Cliente final </label>

        <input
          type="text"
          class="form-control"
          id="cliente_final"
          name="cliente_final"
          required
        />
      </div>

      <div class="col-md-6">
        <label for="contato" class="form-label"> Contato </label>

        <input
          type="text"
          class="form-control"
          id="contato"
          name="contato"
          required
        />
      </div>

      <div class="col-md-6">
        <label for="localidade" class="form-label"> Localidade </label>

        <input
          type="text"
          class="form-control"
          id="localidade"
          name="localidade"
          placeholder="Cidade, unidade ou endereço"
          required
        />
      </div>
    </div>
  </fieldset>
  <fieldset class="mb-4">
    <legend class="h5 border-bottom pb-2 mb-3">Descrição do atendimento</legend>

    <div class="mb-3">
      <label for="escopo" class="form-label"> Escopo </label>

      <textarea
        class="form-control"
        id="escopo"
        name="escopo"
        rows="4"
        placeholder="Descreva o que foi solicitado..."
        required
      ></textarea>
    </div>

    <div class="mb-3">
      <label for="resumo_tecnico" class="form-label"> Resumo técnico </label>

      <textarea
        class="form-control"
        id="resumo_tecnico"
        name="resumo_tecnico"
        rows="6"
        placeholder="Descreva as atividades realizadas, procedimentos, problemas encontrados e solução aplicada..."
        required
      ></textarea>
    </div>
  </fieldset>

  <div class="d-flex justify-content-end gap-2">
    <a href="/chamados" class="btn btn-outline-secondary"> Cancelar </a>

    <button type="submit" class="btn btn-primary">Registrar chamado</button>
  </div>

  <div id="form-result" class="mt-3" aria-live="polite"></div>
</form>

{% endblock %}
