<article id="finished-ticket" class="card border-success shadow-sm">
  <header class="card-header bg-success text-white">
    <div class="d-flex justify-content-between align-items-center">
      <h2 class="h5 mb-0">Atendimento finalizado</h2>
      <span class="badge bg-light text-success"> Finalizado </span>
    </div>
  </header>
  <div class="card-body">
    <dl class="row mb-0">
      <dt class="col-sm-4 text-muted">Cliente</dt>
      <dd class="col-sm-8">{{ ticket.client }}</dd>
      <dt class="col-sm-4 text-muted">Endereço</dt>
      <dd class="col-sm-8">{{ ticket.address }}</dd>
      <dt class="col-sm-4 text-muted">Data</dt>
      <dd class="col-sm-8">{{ ticket.service_date }}</dd>
      <dt class="col-sm-4 text-muted">Início</dt>
      <dd class="col-sm-8">{{ ticket.start_time }}</dd>
      <dt class="col-sm-4 text-muted">Fim</dt>
      <dd class="col-sm-8">{{ ticket.end_time }}</dd>
    </dl>
  </div>
</article>
