<section class="card shadow-sm mb-4" aria-labelledby="search-title">
  <div class="card-body">
    <h2 id="search-title" class="h5">Pesquisar tickets</h2>

    <form class="row g-2">
      <div class="col-12 col-md">
        <label for="ticket-search" class="visually-hidden">
          Pesquisar ticket
        </label>

        <input
          id="ticket-search"
          name="search"
          type="search"
          class="form-control"
          placeholder="Pesquisar por cliente, protocolo ou endereço..."
        />
      </div>
    </form>
  </div>
</section>
