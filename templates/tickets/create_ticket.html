{% extends "layout.html" %} {% block content %}
<div class="container">
  <form method="post" action="/tickets">
    <div class="mb-3">
      <label for="service_date" class="form-label">Data</label>
      <input
        type="date"
        class="form-control"
        id="service_date"
        name="service_date"
        required
      />
    </div>

    <div class="mb-3">
      <label for="service_time" class="form-label">Horário</label>
      <input
        type="time"
        class="form-control"
        id="service_time"
        name="service_time"
        required
      />
    </div>

    <div class="mb-3">
      <label for="contractor" class="form-label">Contratante</label>
      <input
        type="text"
        class="form-control"
        id="contractor"
        name="contractor"
        required
      />
    </div>

    <div class="mb-3">
      <label for="client" class="form-label">Cliente</label>
      <input
        type="text"
        class="form-control"
        id="client"
        name="client"
        required
      />
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Descrição</label>
      <textarea
        class="form-control"
        id="description"
        name="description"
        rows="4"
        required
      ></textarea>
    </div>

    <div class="mb-3">
      <label for="address" class="form-label">Endereço</label>
      <input
        type="text"
        class="form-control"
        id="address"
        name="address"
        required
      />
    </div>

    <div class="mb-3">
      <label for="value" class="form-label">Valor</label>
      <input
        type="number"
        class="form-control"
        id="value"
        name="value"
        min="0"
        step="0.01"
        required
      />
    </div>
    <div class="d-flex justify-content-between">
      <a href="/" class="btn btn-danger">Cancelar</a>
      <button type="submit" class="btn btn-primary">Criar chamado</button>
    </div>
  </form>
</div>
{% endblock %}
