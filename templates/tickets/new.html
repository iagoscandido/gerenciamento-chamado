{% extends "layout.html" %} {% block title %} Novo ticket {% endblock %} {%
block content %}

<div class="container">
  <header class="mb-4">
    <h1 class="h2 mb-1">Novo ticket</h1>
    <p class="text-muted mb-0">Registre um novo atendimento técnico.</p>
  </header>

  <section class="card shadow-sm" aria-labelledby="new-ticket-title">
    <div class="card-body">
      <h2 id="new-ticket-title" class="h5 mb-4">Dados do atendimento</h2>

      <form action="/tickets" method="POST">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label for="service_date" class="form-label">
              Data de atendimento
            </label>

            <input
              id="service_date"
              name="service_date"
              type="date"
              class="form-control"
              required
            />
          </div>

          <div class="col-12 col-md-6">
            <label for="contractor" class="form-label"> Contratante </label>

            <input
              id="contractor"
              name="contractor"
              type="text"
              class="form-control"
              autocomplete="organization"
              required
            />
          </div>

          <div class="col-12">
            <label for="client" class="form-label"> Cliente </label>

            <input
              id="client"
              name="client"
              type="text"
              class="form-control"
              autocomplete="name"
              required
            />
          </div>

          <div class="col-12">
            <label for="address" class="form-label"> Endereço </label>

            <input
              id="address"
              name="address"
              type="text"
              class="form-control"
              autocomplete="street-address"
              required
            />
          </div>

          <div class="col-12 col-md-6">
            <label for="value" class="form-label"> Valor </label>
            <div class="input-group">
              <span class="input-group-text"> R$ </span>
              <input
                id="value"
                name="value"
                type="number"
                class="form-control"
                min="0"
                step="0.01"
                required
              />
            </div>
          </div>
        </div>

        <hr class="my-4" />

        <div class="d-flex flex-column flex-sm-row justify-content-end gap-2">
          <a href="/tickets/" class="btn btn-outline-secondary"> Cancelar </a>
          <button type="submit" class="btn btn-primary">Criar ticket</button>
        </div>
      </form>
    </div>
  </section>
</div>

{% endblock %}
